name: Setup build
description: Garante o wrapper executavel, configura JDK (Azul 21) e Gradle com cache, e opcionalmente o cache do Kotlin/Native.

inputs:
  konan:
    description: Cacheia ~/.konan (compilador Kotlin/Native, LLVM e platform libs). Use nos jobs Apple.
    default: 'false'

runs:
  using: composite
  steps:
    # o bit de execucao do gradlew se perde facil em fluxo Windows (core.filemode
    # false), e sem ele todo job morre com "./gradlew: Permission denied"
    - name: Garante o wrapper executavel
      shell: bash
      run: chmod +x gradlew

    - uses: actions/setup-java@v6
      with:
        distribution: zulu
        java-version: 21

    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - if: inputs.konan == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: konan-${{ runner.os }}-
